{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-12" data-aos="fade-down">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Find Hotels</h1>
            <p class="text-xl text-gray-600">Search hotels with our smart filters</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8" data-aos="fade-up">
            <div class="grid md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2">City</label>
                    <input type="text" id="city" class="w-full border rounded-lg p-2" placeholder="Enter city">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">View Type</label>
                    <select id="view" class="w-full border rounded-lg p-2">
                        <option value="">All Views</option>
                        <option value="mountain">Mountain View</option>
                        <option value="lake">Lake View</option>
                        <option value="garden">Garden View</option>
                        <option value="city">City View</option>
                        <option value="pool">Pool View</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center mt-6">
                        <input type="checkbox" id="petFriendly" class="mr-2">
                        <span class="text-sm">Pet Friendly</span>
                    </label>
                </div>
                <div>
                    <label class="flex items-center mt-6">
                        <input type="checkbox" id="seniorFriendly" class="mr-2">
                        <span class="text-sm">Senior Citizen Friendly</span>
                    </label>
                </div>
            </div>
            <div class="mt-4">
                <button onclick="searchHotels()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    Search Hotels
                </button>
            </div>
        </div>

        <div id="hotelsList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
</div>

<script>
async function searchHotels() {
    const city = document.getElementById('city').value;
    const view = document.getElementById('view').value;
    const petFriendly = document.getElementById('petFriendly').checked;
    const seniorFriendly = document.getElementById('seniorFriendly').checked;
    
    let url = '/api/hotels?';
    if (city) url += `city=${encodeURIComponent(city)}&`;
    if (view) url += `view=${view}&`;
    if (petFriendly) url += `pet_friendly=true&`;
    if (seniorFriendly) url += `senior_friendly=true&`;
    
    const res = await fetch(url);
    const hotels = await res.json();
    
    const container = document.getElementById('hotelsList');
    if (hotels.length === 0) {
        container.innerHTML = '<div class="col-span-3 text-center py-12 text-gray-500">No hotels found</div>';
        return;
    }
    
    container.innerHTML = hotels.map(hotel => `
        <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition">
            <img src="${hotel.image}" alt="${hotel.name}" class="w-full h-48 object-cover">
            <div class="p-4">
                <h3 class="font-bold text-lg">${hotel.name}</h3>
                <p class="text-gray-600">${hotel.city}</p>
                <div class="flex items-center mt-2">
                    <span class="text-yellow-500">★</span>
                    <span class="ml-1">${hotel.rating}</span>
                </div>
                <p class="text-2xl font-bold text-blue-600 mt-2">$${hotel.price}/night</p>
                <div class="flex gap-2 mt-3">
                    ${hotel.pet_friendly ? '<span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">🐾 Pet Friendly</span>' : ''}
                    ${hotel.senior_friendly ? '<span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">👴 Senior Friendly</span>' : ''}
                </div>
                <button onclick="window.location.href='/booking?type=hotel'" 
                        class="mt-3 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                    Book Now
                </button>
            </div>
        </div>
    `).join('');
}
</script>
{% endblock %}
